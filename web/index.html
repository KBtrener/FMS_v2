<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>QuickScreen · KB Trener</title>
  <link rel="stylesheet" href="./design-system.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js?v=utf8-20260912"></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Lista klientów">
      <span class="brand-logo-viewport"><img class="brand-logo" src="./assets/kb-logo.png" alt="Karol Bilecki"></span>
      <span class="brand-copy"><strong>QuickScreen <span aria-hidden="true">⌄</span></strong><small><i></i>Zapisano lokalnie</small></span>
    </button>
    <nav class="topnav" aria-label="Główna nawigacja">
      <button class="nav-link" data-action="home"><span aria-hidden="true">♙</span><em>Klienci</em></button>
      <button class="nav-link" data-action="new-assessment-nav"><span aria-hidden="true">＋</span><em>Badanie</em></button>
      <button class="nav-link" data-action="reports"><span aria-hidden="true">▤</span><em>Raporty</em></button>
      <button class="nav-link" data-action="config"><span aria-hidden="true">☷</span><em>Konfiguracja</em></button>
    </nav>
    <button class="account-button" data-action="profile-user" aria-label="Konto trenera"><span class="sync-icon" aria-hidden="true">☁</span><span class="avatar-icon" aria-hidden="true">♙</span></button>
  </header>
  <main id="app" class="app-shell" aria-live="polite"><section class="loading-state"><span class="loader"></span><p>Przygotowuję aplikację…</p></section></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal-layer" hidden></div>
</body>
</html>
