<style>
  :root {
    --ink: #142d37;
    --ink-soft: #4c626a;
    --paper: #f7f3e9;
    --paper-deep: #ede6d7;
    --white: #fffdf8;
    --coral: #ef604e;
    --coral-dark: #c94638;
    --lime: #cfe36d;
    --line: #cbd4d1;
    --success: #21785f;
    --danger: #b33b31;
    --shadow: 0 18px 50px rgba(20,45,55,.12);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--paper); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font-family: Manrope, sans-serif; background:
    radial-gradient(circle at 4% 2%, rgba(207,227,109,.28), transparent 25rem),
    linear-gradient(135deg, var(--paper), #faf8f1 55%, #f0eadf); }
  button, input, textarea { font: inherit; }
  button { color: inherit; }
  .page-grain { position: fixed; inset: 0; pointer-events: none; opacity: .24; z-index: -1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E"); }
  .topbar { height: 78px; padding: 0 max(20px, calc((100vw - 1200px)/2)); display: flex; align-items: center; justify-content: space-between;
    background: rgba(247,243,233,.88); border-bottom: 1px solid rgba(20,45,55,.14); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 30; }
  .brand { appearance: none; border: 0; background: transparent; display: flex; align-items: center; gap: 11px; cursor: pointer; padding: 0; text-align: left; }
  .brand-mark { width: 43px; height: 43px; border-radius: 14px 14px 14px 4px; background: var(--coral); color: white; display: grid; place-items: center;
    font-family: Fraunces, serif; font-size: 28px; box-shadow: 5px 5px 0 var(--ink); transform: rotate(-2deg); }
  .brand strong { font-family: Fraunces, serif; display: block; font-size: 18px; line-height: 1; }
  .brand small { color: var(--ink-soft); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; }
  .topnav { display: flex; gap: 6px; }
  .nav-link { border: 0; background: transparent; padding: 10px 14px; border-radius: 999px; font-weight: 700; cursor: pointer; }
  .nav-link.is-active, .nav-link:hover { background: var(--ink); color: var(--white); }
  .app-shell { width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 96px; }
  .loading-state, .empty-state { min-height: 50vh; display: grid; place-items: center; align-content: center; text-align: center; color: var(--ink-soft); }
  .loader { width: 38px; height: 38px; border: 3px solid var(--line); border-top-color: var(--coral); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--coral-dark); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 800; }
  .eyebrow::before { content: ""; width: 28px; border-top: 3px solid currentColor; }
  h1, h2, h3 { font-family: Fraunces, serif; letter-spacing: -.025em; }
  h1 { font-size: clamp(38px, 6vw, 68px); line-height: .98; margin: 12px 0 18px; max-width: 760px; }
  h2 { font-size: clamp(26px, 4vw, 38px); margin: 0; }
  h3 { font-size: 22px; margin: 0; }
  p { line-height: 1.65; }
  .hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 30px; margin-bottom: 38px; animation: enter .45s ease both; }
  .hero-copy { max-width: 670px; color: var(--ink-soft); }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
  .btn { min-height: 48px; border: 1px solid var(--ink); border-radius: 14px; background: var(--white); padding: 0 18px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px; transition: .18s ease; text-decoration: none; }
  .btn:hover { transform: translateY(-2px); box-shadow: 4px 5px 0 var(--ink); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn-primary { background: var(--coral); border-color: var(--coral); color: white; }
  .btn-dark { background: var(--ink); color: white; }
  .btn-quiet { border-color: transparent; background: transparent; color: var(--ink-soft); }
  .btn-danger { color: var(--danger); border-color: #e7bcb7; }
  .btn[disabled] { opacity: .48; cursor: wait; transform: none; box-shadow: none; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
  .search { flex: 1 1 300px; position: relative; }
  .search input, .field input, .field textarea { width: 100%; border: 1px solid var(--line); background: rgba(255,253,248,.9); color: var(--ink); border-radius: 14px;
    padding: 14px 16px; outline: 0; transition: .2s; }
  .search input { padding-left: 44px; }
  .search::before { content: "⌕"; position: absolute; left: 16px; top: 10px; font-size: 22px; color: var(--ink-soft); }
  .search input:focus, .field input:focus, .field textarea:focus { border-color: var(--coral); box-shadow: 0 0 0 4px rgba(239,96,78,.13); }
  .check { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-soft); }
  .client-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .client-card { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,253,248,.78); padding: 22px; text-align: left; cursor: pointer;
    min-height: 184px; display: flex; flex-direction: column; transition: .22s ease; animation: enter .4s ease both; }
  .client-card:hover { transform: translateY(-4px) rotate(-.35deg); border-color: var(--ink); box-shadow: var(--shadow); }
  .client-card .initials { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); font-weight: 800; margin-bottom: 28px; }
  .client-card strong { font-family: Fraunces, serif; font-size: 22px; }
  .client-card small { color: var(--ink-soft); margin-top: 4px; overflow-wrap: anywhere; }
  .client-card footer { margin-top: auto; padding-top: 17px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); }
  .score-pill { color: var(--ink); font-weight: 800; }
  .profile-head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; margin-bottom: 28px; }
  .profile-name h1 { font-size: clamp(38px, 6vw, 60px); margin-bottom: 8px; }

  .score-orbit small { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
  .profile-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .8fr); gap: 20px; }
  .panel { background: rgba(255,253,248,.82); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: 0 8px 25px rgba(20,45,55,.05); }
  .panel-head { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 20px; }
  .result-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .result-chip { background: var(--paper); border-radius: 14px; padding: 13px 10px; min-width: 0; }
  .result-chip small { color: var(--ink-soft); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-chip b { font-family: Fraunces, serif; font-size: 28px; }
  .effect-note { margin: 18px 0 0; border-left: 4px solid var(--coral); background: #fff0eb; padding: 12px 14px; border-radius: 0 12px 12px 0; font-size: 13px; }
  .chart { width: 100%; height: 190px; overflow: visible; }
  .chart text { font: 10px Manrope, sans-serif; fill: var(--ink-soft); }
  .history-list { display: grid; gap: 9px; }
  .history-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
  .history-row:first-child { border: 0; padding-top: 0; }
  .history-row b { font-family: Fraunces, serif; font-size: 22px; }
  .icon-btn { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 12px; background: transparent; cursor: pointer; }
  .icon-btn:hover { background: var(--paper); }
  .status-list { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }

  .status-list b.is-alert { color: var(--danger); }
  .assessment-shell { max-width: 860px; margin: 0 auto; }
  .assessment-top { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; margin-bottom: 20px; }

  .step-dot.is-current { background: var(--coral); transform: scaleY(1.6); }
  .test-card { border: 1px solid var(--line); background: rgba(255,253,248,.94); border-radius: 28px; padding: clamp(22px, 5vw, 42px); box-shadow: var(--shadow); animation: enter .3s ease both; }
  .test-card h2 { margin: 4px 0 10px; }
  .test-card .description { color: var(--ink-soft); margin-bottom: 18px; }
  details.criteria { background: var(--paper); border-radius: 14px; margin: 16px 0 28px; }
  details.criteria summary { cursor: pointer; padding: 13px 16px; font-weight: 800; }
  details.criteria p { padding: 0 16px 14px; margin: 0; color: var(--ink-soft); font-size: 13px; }
  .answer-section { display: grid; gap: 18px; }
  .answer-group { border-top: 1px solid var(--line); padding-top: 18px; }
  .answer-label { display: flex; justify-content: space-between; gap: 12px; font-weight: 800; margin-bottom: 10px; }
  .answer-label small { color: var(--ink-soft); font-weight: 600; }
  .answer-options { display: grid; grid-template-columns: repeat(var(--count, 2), 1fr); gap: 8px; }
  .answer-btn { min-height: 58px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); font-weight: 800; cursor: pointer; position: relative; }
  .answer-btn:hover { border-color: var(--ink); }
  .answer-btn.is-selected { background: var(--ink); color: white; border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--lime); }
  .answer-btn.is-pain.is-selected { background: var(--danger); box-shadow: inset 0 0 0 3px #ffc4bc; }
  .assessment-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; position: sticky; bottom: 14px; z-index: 10; }
  .assessment-nav .btn { backdrop-filter: blur(12px); }
  .meta-fields { display: grid; grid-template-columns: 200px 1fr; gap: 12px; margin-bottom: 18px; }
  .field { display: grid; gap: 7px; font-size: 13px; font-weight: 700; }
  .field textarea { min-height: 92px; resize: vertical; }
  .modal-layer { position: fixed; inset: 0; background: rgba(12,29,36,.65); z-index: 50; display: grid; place-items: center; padding: 20px; backdrop-filter: blur(8px); }
  .modal-layer[hidden] { display: none; }
  .modal { width: min(580px, 100%); max-height: min(760px, calc(100vh - 40px)); overflow: auto; background: var(--white); border-radius: 26px; padding: 28px; box-shadow: var(--shadow); animation: enter .25s ease both; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .form-stack { display: grid; gap: 14px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .toast { position: fixed; right: 20px; bottom: 20px; z-index: 80; background: var(--ink); color: white; border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow);
    max-width: 390px; transform: translateY(120px); opacity: 0; transition: .25s ease; }
  .toast.is-visible { transform: none; opacity: 1; }
  .toast.is-error { background: var(--danger); }
  .report-cover { display: flex; justify-content: space-between; align-items: end; gap: 20px; border-bottom: 4px solid var(--ink); padding-bottom: 22px; margin-bottom: 24px; }
  .report-score { font-family: Fraunces, serif; font-size: 54px; color: var(--coral); white-space: nowrap; }
  .matrix-wrap { overflow-x: auto; }
  .matrix { border-collapse: collapse; width: 100%; min-width: 540px; font-size: 12px; }
  .matrix th, .matrix td { border: 1px solid var(--line); padding: 10px; text-align: left; }
  .matrix thead { background: var(--ink); color: white; }
  .rule-list { display: grid; gap: 12px; margin-top: 24px; }
  .rule-card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; border: 1px solid var(--line); border-radius: 16px; padding: 17px; background: var(--white); }
  .rule-card p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13px; }
  .toggle { width: 52px; height: 30px; border: 0; border-radius: 999px; background: var(--line); padding: 3px; cursor: pointer; }
  .toggle::after { content: ""; display: block; width: 24px; height: 24px; border-radius: 50%; background: white; transition: .2s; box-shadow: 0 2px 6px #0002; }
  .toggle.is-on { background: var(--success); }
  .toggle.is-on::after { transform: translateX(22px); }
  .setup-card { max-width: 720px; margin: 50px auto; border: 1px solid var(--line); border-radius: 30px; padding: clamp(28px,6vw,56px); background: var(--white); box-shadow: var(--shadow); }
  .setup-card code { background: var(--paper); padding: 3px 7px; border-radius: 6px; overflow-wrap: anywhere; }
  .archived { opacity: .62; }
  @media (max-width: 850px) {

    .profile-layout { grid-template-columns: 1fr; }
    .result-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 580px) {
    .topbar { height: 68px; padding: 0 16px; }
    .brand small { display: none; }
    .brand-mark { width: 37px; height: 37px; }
    .nav-link { padding: 9px 10px; font-size: 12px; }
    .app-shell { width: min(100% - 28px, 1200px); padding-top: 30px; }
    .hero, .profile-head, .assessment-top { grid-template-columns: 1fr; align-items: start; }
    .hero .btn { width: 100%; }
    .client-grid { grid-template-columns: 1fr; }
    .client-card { min-height: 154px; }
    .profile-head { position: relative; }
    .score-orbit { width: 110px; position: absolute; right: 0; top: 0; }
    .score-orbit b { font-size: 40px; }
    .profile-name { padding-right: 120px; min-height: 110px; }
    .result-grid { grid-template-columns: repeat(2, 1fr); }
    .meta-fields { grid-template-columns: 1fr; }
    .answer-options { grid-template-columns: repeat(2, 1fr); }
    .answer-btn { min-height: 62px; }
    .assessment-nav .btn { flex: 1; }
    .report-cover { align-items: start; }
    .report-score { font-size: 42px; }
  }
  @media print {
    .topbar, .report-actions { display: none !important; }
    .app-shell { width: 100%; padding: 0; }
    body { background: white; }
    .panel { border: 0; box-shadow: none; }
  }
</style>
