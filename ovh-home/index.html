<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>FMS Wizard</title>
    <script type="module" crossorigin src="/assets/index-Cs_-8TJy.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CvuHsyeq.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script>
    <style>
      :root{--qs-ink:#0f172a;--qs-teal:#0d9488;--qs-line:#e2e8f0;--qs-muted:#64748b;--qs-base:#f8fafc}
      html,body{min-height:100%;background:var(--qs-base)}
      .quickscreen-launcher-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(920px,calc(100% - 48px));margin:clamp(32px,8vh,88px) auto 48px;font-family:Inter,system-ui,sans-serif}
      .quickscreen-tile{position:relative;display:flex;align-items:center;gap:18px;min-height:148px;padding:24px;border:1px solid var(--qs-line);border-radius:16px;background:#fff;color:var(--qs-ink);text-decoration:none;box-shadow:0 4px 20px rgba(15,23,42,.045);overflow:hidden;transition:border-color .2s,background-color .2s}
      .quickscreen-tile:after{content:'→';margin-left:auto;color:var(--qs-teal);font:500 28px/1 Outfit,sans-serif;transition:transform .2s}
      .quickscreen-tile:hover,.quickscreen-tile:focus-visible{border-color:rgba(13,148,136,.55);background:#fbfffe}
      .quickscreen-tile:hover:after,.quickscreen-tile:focus-visible:after{transform:translateX(4px)}
      .tile-mark{display:grid;place-items:center;flex:0 0 56px;width:56px;height:56px;border-radius:12px;background:var(--qs-ink);color:#fff}
      .tile-mark.teal{background:var(--qs-teal)}
      .tile-mark svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}
      .tile-kicker{display:block;margin-bottom:6px;color:var(--qs-teal);font:700 10px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}
      .quickscreen-tile strong{display:block;font:600 clamp(18px,2vw,22px)/1.15 Outfit,sans-serif;letter-spacing:-.01em}
      .quickscreen-tile small{display:block;margin-top:7px;color:var(--qs-muted);font:400 13px/1.4 Inter,sans-serif}
      @media (max-width:640px){.quickscreen-launcher-grid{grid-template-columns:1fr;width:calc(100% - 32px);gap:12px;margin:24px auto 32px}.quickscreen-tile{min-height:104px;padding:18px}.tile-mark{flex-basis:48px;width:48px;height:48px}.tile-mark svg{width:23px;height:23px}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <section class="quickscreen-launcher-grid" aria-label="Wybierz aplikację">
      <a class="quickscreen-tile" href="/quick-screen-v2/" aria-label="Otwórz QuickScreen v2"><span class="tile-mark teal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17.5V6.5M4 12h16M20 6.5v11"/><path d="m8 8 4-4 4 4M8 16l4 4 4-4"/></svg></span><span><b class="tile-kicker">Screening</b><strong>QuickScreen v2</strong><small>Najnowsza wersja screeningu ruchowego</small></span></a>
      <a class="quickscreen-tile" href="/quickscreen/" aria-label="Otwórz QuickScreen"><span class="tile-mark teal" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8M12 8v8"/></svg></span><span><b class="tile-kicker">Screening</b><strong>QuickScreen</strong><small>Klasyczna wersja aplikacji</small></span></a>
      <a class="quickscreen-tile" href="/fms" aria-label="Otwórz FMS"><span class="tile-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v6m0 0-4 7m4-7 4 7M8 10l4 3 4-3"/></svg></span><span><b class="tile-kicker">System oceny</b><strong>FMS</strong><small>Functional Movement Screen</small></span></a>
      <a class="quickscreen-tile" href="/sfma" aria-label="Otwórz SFMA"><span class="tile-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 18V9m7 9V5m7 13v-6"/><path d="M3 18h18M3 6h4M17 6h4"/></svg></span><span><b class="tile-kicker">System oceny</b><strong>SFMA</strong><small>Select Functional Movement Assessment</small></span></a>
    </section>
  </body>
</html>
